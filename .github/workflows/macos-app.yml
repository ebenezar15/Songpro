name: macOS app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the .dmg files to a release when a v* tag is pushed

jobs:
  build:
    name: Kuralkoodu.app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            arch: arm64
          - os: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and integration tests on macOS
        run: |
          python -m pip install -q -r backend/requirements.txt
          cd backend && python -m pytest -q
      - name: Build Kuralkoodu.app and .dmg (includes a packaged self-test)
        run: PYTHON=python packaging/macos/build.sh
      - name: Check the bundle
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          file dist/Kuralkoodu.app/Contents/MacOS/Kuralkoodu
          codesign --verify --deep --strict dist/Kuralkoodu.app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/Kuralkoodu.app/Contents/Info.plist
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Kuralkoodu-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
